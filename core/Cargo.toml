[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
mail-model = { path = "crates/mail-model" }
mail-store = { path = "crates/mail-store" }
mail-mime = { path = "crates/mail-mime" }
proto-imap = { path = "crates/proto-imap" }
proto-smtp = { path = "crates/proto-smtp" }
mail-auth = { path = "crates/mail-auth" }
mail-sync = { path = "crates/mail-sync" }

ammonia = "4.2"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
encoding_rs = "0.8"
futures = "0.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
mail-parser = "1.0"
roxmltree = "0.21"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
uniffi = "=0.31"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
percent-encoding = "2"
utf7-imap = "0.3"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
